name:        cmirror
type:        analog
function:    "Espejo de corriente NMOS 1:1"
owner:       "RodSchz"
status:      drc_clean            # draft | schematic_ok | drc_clean | lvs_clean | verified | released

process:     CIDESI_CM05

topology:
  description: >
    Espejo de corriente NMOS básico de dos transistores. M1 en conexión de
    diodo (compuerta unida al drenaje) fija la tensión de compuerta; M2 copia
    la corriente hacia P2. Relación nominal 1:1.
  devices:
    - {name: M1, model: CIDNMOS, l_um: 10, w_um: 100, role: "diodo de referencia"}
    - {name: M2, model: CIDNMOS, l_um: 10, w_um: 100, role: "espejo de salida"}

ports:
  # El orden importa: debe coincidir entre .asy, .asc y el netlist extraído.
  schematic_order: [COM, P1, P2]    # segun cmirror.asy (SpiceOrder)
  layout_order:    [P1, P2, COM]    # segun el netlist extraido por KLayout
  pins:
    - {name: P1,  direction: input,  description: "entrada de corriente (rama de diodo)"}
    - {name: P2,  direction: output, description: "salida espejada"}
    - {name: COM, direction: ground, description: "fuente común"}

operating_conditions:
  vdd_v:       5.0
  temp_c:      [27]                # unico punto simulado
  corners:     [tt]                # PENDIENTE: el PDK no define ff ni ss
  monte_carlo: false               # PENDIENTE: los modelos no traen dispersión

# ---------------------------------------------------------------------------
# Especificaciones
#
# Cada medición declara CON QUÉ se obtuvo y EN QUÉ ETAPA:
#   sim:   ltspice | ngspice
#   stage: schematic (pre-layout, ideal) | extracted (post-LVS) | pex (con parásitos)
#
# Los objetivos siguen sin fijarse: esta celda se dibujó antes de existir un
# criterio de aceptación. Definirlos es trabajo pendiente.
# ---------------------------------------------------------------------------
specs:
  - {name: ratio_10uA,   target: null, measured: 1.0101,   unit: A/A,   sim: ngspice, stage: extracted, tb: ngspice/cmirror_tb.spice}
  - {name: ratio_50uA,   target: null, measured: 1.0032,   unit: A/A,   sim: ngspice, stage: extracted, tb: ngspice/cmirror_tb.spice}
  - {name: ratio_100uA,  target: null, measured: 1.0016,   unit: A/A,   sim: ngspice, stage: extracted, tb: ngspice/cmirror_tb.spice}
  - {name: ratio_190uA,  target: null, measured: 1.0006,   unit: A/A,   sim: ngspice, stage: extracted, tb: ngspice/cmirror_tb.spice}
  - {name: vgs_100uA,    target: null, measured: 1.6685,   unit: V,     sim: ngspice, stage: extracted, tb: ngspice/cmirror_tb.spice}
  - {name: iout_vout4V,  target: null, measured: 100.45,   unit: uA,    sim: ngspice, stage: extracted, tb: ngspice/cmirror_tb.spice}
  - {name: r_out,        target: null, measured: 5.12,     unit: MOhm,  sim: ngspice, stage: extracted, tb: ngspice/cmirror_tb.spice}
  - {name: v_min_out,    target: null, measured: 0.836,    unit: V,     sim: ngspice, stage: extracted, tb: ngspice/cmirror_tb.spice}
  - {name: mismatch_3s,  target: null, measured: null,     unit: "%",   sim: null,    stage: null,      tb: null}

# La relación queda por encima de 1 y baja al subir la corriente: modulación de
# longitud de canal. M1 en diodo mantiene su drenaje en V_GS = 1.67 V mientras
# M2 lo tiene en 2.5 V, y esa diferencia de V_DS hace que M2 conduzca un poco
# más. Ver ngspice/README.md.

matching:
  critical_pairs: [[M1, M2]]
  guard_rings:    false            # PENDIENTE verificar en el layout
  dummies:        false            # PENDIENTE
  common_centroid: false           # PENDIENTE: recomendable para un espejo

geometry:
  width_um:  185.0
  height_um: 160.0
  source:    "medido sobre cmirror.gds con KLayout"

verification:
  drc:
    status: clean
    report: results/CIDESI_CMOS_DRC.lyrdb
    runset: "CIDESI_CM05/tech/CIDESI_CM05/drc/drc.lydrc"
  lvs:
    status: manual_match           # comparación manual de netlists, no LVS formal
    note: >
      El netlist extraído (layout/cmirror.cir) coincide topológicamente con el
      esquemático: M1 en diodo, M2 espejo, ambos CIDNMOS L=10u W=100u. La
      permuta drenaje/fuente en M1 es normal en extracción. PENDIENTE correr
      LVS formal en KLayout.

# ---------------------------------------------------------------------------
# Dos entornos, dos etapas — no son copias uno del otro.
#   ltspice/  parte del esquemático dibujado (pre-layout, ideal)
#   ngspice/  parte del netlist extraído del layout (post-layout, real)
# La diferencia entre ambos es el dato, no un problema a resolver.
# ---------------------------------------------------------------------------
files:
  ltspice:
    schematic:  ltspice/cmirror.asc
    symbol:     ltspice/cmirror.asy
    testbench:  ltspice/cmirror_sim.asc
  ngspice:
    testbench:  ngspice/cmirror_tb.spice
    runner:     ngspice/run.sh
    log:        results/cmirror_ngspice.log
  layout:
    gds:        layout/cmirror.gds
    netlist:    layout/cmirror.cir
  design_doc:   docs/design.md

notes: >
  El GDS original contenía cinco celdas (cmirror, cmirror_lay, prueba,
  Inverter, AND2X1). Aquí se conserva únicamente la celda cmirror; el archivo
  completo está en _legacy/espejo_corriente/cmirror_multicelda.gds.
