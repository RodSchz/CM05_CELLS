    severity: alta
    summary: >
      El archivo es XNOR2x1 (x minuscula) y la celda del layout es XNOR2X1.
      En Windows es indistinto, pero en el runner Linux del CI son dos nombres
      distintos y algo va a fallar. Unificar a XNOR2X1.
    owner: ""
    issue: null
