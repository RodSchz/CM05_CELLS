    severity: media
    summary: >
      El esquematico nombra la alimentacion V+ / V- y el layout extraido usa
      VDD / GND. Deben coincidir para que el LVS empareje los puertos.
    owner: ""
    issue: null
  - id: netlist-sin-puertos
    severity: alta
    summary: >
      El netlist heredado solo declaraba VDD y GND como puertos; las entradas y
      la salida quedaron como nodos internos. Falta re-extraer desde KLayout con
      el etiquetado de pines corregido.
    owner: ""
